<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>Chats</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #111; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      display: grid; place-items: center; min-height: 100vh;
    }
    .phone {
      width: 390px; height: 844px; background: #050805; color: #E7F6EC;
      border-radius: 28px; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }
    .top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
    .top h1 { font-size: 22px; margin: 0; font-weight: 600; letter-spacing: -.4px; flex: 1; }
    .add { width: 44px; height: 44px; display: grid; place-items: center; color: #3DFF9A; font-size: 22px; }
    .new {
      margin: 0 16px 16px; padding: 12px; text-align: center; border-radius: 16px;
      background: rgba(61,255,154,.13); color: #3DFF9A; font-weight: 600;
    }
    .row {
      margin: 0 16px 8px; padding: 12px 14px; border-radius: 12px;
      background: #0C140F; border: 1px solid #1C3326;
    }
    .row.active { background: rgba(61,255,154,.13); border-color: #178A4E; }
    .row b { display: block; font-size: 15px; margin-bottom: 4px; }
    .row span { color: #7A9A86; font-size: 13px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="top"><div>←</div><h1>Чаты</h1><div class="add">+</div></div>
    <div class="new">Новый чат</div>
    <div class="row active"><b>что в Download</b><span>Картинки, zip и несколько APK.</span></div>
    <div class="row"><b>Распакуй zip в Download</b><span>Архив распакован на телефоне</span></div>
    <div class="row"><b>Что на этом скриншоте?</b><span>Это Pixel 9 Pro</span></div>
  </div>
</body>
</html>
