<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>DeepSeek UI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; display: grid; place-items: center; min-height: 100vh; font-family: Inter, system-ui, sans-serif; }
    .phone { width: 390px; height: 844px; background: #121316; color: #E6EDF3; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; }
    .top { height: 56px; display: flex; align-items: center; padding: 0 8px; }
    .icon { width: 44px; height: 44px; display: grid; place-items: center; color: #E6EDF3; }
    .model { flex: 1; text-align: center; font-weight: 600; font-size: 17px; }
    main { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; }
    .logo { width: 64px; height: 64px; border-radius: 50%; background: #426EFE; color: #fff; display: grid; place-items: center; font-size: 32px; font-weight: 700; margin: 0 auto 16px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { margin: 0; color: #8D96A0; font-size: 15px; }
    .chip { margin-top: 12px; border: 1px solid #32363F; background: #1E2025; border-radius: 12px; padding: 12px 16px; text-align: left; font-size: 14px; }
    footer { padding: 10px 16px 16px; }
    .box { background: #1E2025; border: 1px solid #32363F; border-radius: 20px; padding: 12px; }
    .ph { color: #8D96A0; font-size: 15px; padding: 4px; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .pill { display: flex; align-items: center; gap: 4px; border-radius: 16px; padding: 5px 10px; font-size: 12px; background: #272A30; color: #E6EDF3; }
    .pill.on { background: rgba(66,110,254,.15); color: #426EFE; border: 1px solid #426EFE; font-weight: 600; }
    .plus { margin-left: auto; color: #8D96A0; font-size: 20px; }
    .send { width: 32px; height: 32px; border-radius: 50%; background: #2C313A; color: #6B7280; display: grid; place-items: center; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="top"><div class="icon">☰</div><div class="model">Gemini 3.1 Pro ⌄</div><div class="icon">✎</div></div>
    <main>
      <div>
        <div class="logo">D</div>
        <h1>Привет, я DeepSeek.</h1>
        <p>Чем я могу помочь вам сегодня?</p>
        <div class="chip">Объясни квантовые вычисления простыми словами</div>
      </div>
    </main>
    <footer>
      <div class="box">
        <div class="ph">Спросите о чем угодно...</div>
        <div class="row">
          <div class="pill">🧠 DeepThink (R1)</div>
          <div class="pill on">🌐 Поиск</div>
          <div class="plus">⊕</div>
          <div class="send">↑</div>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
