<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>Chat</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #111; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      display: grid; place-items: center; min-height: 100vh;
    }
    .phone {
      width: 390px; height: 844px; background: #050805; color: #E7F6EC;
      border-radius: 28px; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }
    .top { display: flex; justify-content: space-between; padding: 8px 12px 0; }
    .icon { width: 44px; height: 44px; display: grid; place-items: center; color: #7A9A86; font-size: 18px; }
    main { flex: 1; overflow: auto; padding: 8px 16px 12px; }
    .user { display: flex; justify-content: flex-end; margin: 10px 0; }
    .user p {
      max-width: 86%; background: #3DFF9A; color: #03140A;
      border-radius: 18px 18px 4px 18px; padding: 10px 14px; margin: 0; font-size: 15px;
    }
    .think { color: #8FB89C; font-size: 13px; font-weight: 500; margin: 12px 0 6px; }
    .think span { color: #7A9A86; font-weight: 400; }
    .tool-line {
      color: #7A9A86; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 4px; padding: 3px 0;
    }
    .tool-line em { font-style: normal; color: #5f7d6a; font-size: 14px; }
    .cmd {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid #1C3326; background: #0C140F; border-radius: 10px;
      padding: 8px 10px; margin: 6px 0 4px; color: #3DFF9A;
      font: 12px ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cmd span { color: #7A9A86; margin-left: auto; }
    .out {
      color: #8FB89C; font: 12px/17px ui-monospace, monospace;
      max-height: 88px; overflow: hidden; padding: 0 10px 6px;
    }
    h3 { color: #3DFF9A; font-size: 15px; margin: 14px 0 8px; }
    ul { margin: 0; padding: 0; list-style: none; }
    li { display: flex; gap: 8px; font-size: 15px; line-height: 22px; margin: 0 0 8px; }
    li:before { content: "•"; color: #3DFF9A; width: 14px; }
    footer { padding: 8px 12px 12px; }
    .composer {
      display: flex; align-items: center; gap: 4px; padding: 6px;
      border: 1px solid #1C3326; background: #0C140F; border-radius: 22px;
    }
    .model {
      height: 44px; max-width: 118px; padding: 0 10px;
      display: grid; place-items: center; border-radius: 16px;
      background: rgba(61,255,154,.13); color: #3DFF9A; font-size: 12px; font-weight: 600;
      white-space: nowrap;
    }
    .clip { width: 40px; height: 44px; display: grid; place-items: center; color: #7A9A86; font-size: 18px; }
    .composer input {
      flex: 1; border: 0; background: transparent; color: #E7F6EC;
      font-size: 16px; padding: 8px 4px; outline: none; min-width: 0;
    }
    .send {
      width: 44px; height: 44px; border-radius: 99px;
      display: grid; place-items: center; background: #3DFF9A; color: #03140A;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="top"><div class="icon">💬</div><div class="icon">⚙</div></div>
    <main>
      <div class="user"><p>что в Download</p></div>
      <div class="think">Thought <span>for 2s</span> ▾</div>
      <div class="tool-line">Explored 11 files <em>▾</em></div>
      <div class="tool-line">Read ToolCatalog.kt <em>▾</em></div>
      <div class="tool-line">Read ToolExecutor.kt <em>▾</em></div>
      <div class="cmd">ls /sdcard/Download <span>▾</span></div>
      <div class="out">Attached_image.png<br>BRENE-v0.0.66.zip<br>Bozya-VPN-debug.apk</div>
      <h3>В Download</h3>
      <ul>
        <li><span>Картинки, zip и несколько APK.</span></li>
        <li><span>Команда свёрнута в одну строку.</span></li>
      </ul>
    </main>
    <footer>
      <div class="composer">
        <div class="model">3.8 Flash</div>
        <div class="clip">📎</div>
        <input placeholder="Задача для телефона…" />
        <div class="send">➤</div>
      </div>
    </footer>
  </div>
</body>
</html>
