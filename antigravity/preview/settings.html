<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <title>Antigravity settings</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; font-family: Inter, ui-sans-serif, system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
    .phone {
      width: 390px; height: 844px; background: #050805; color: #E7F6EC;
      border-radius: 28px; overflow: hidden; padding: 18px 20px 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,.55); display: flex; flex-direction: column;
    }
    .top { display: flex; align-items: center; gap: 8px; }
    .back { width: 44px; height: 44px; display: grid; place-items: center; font-size: 20px; }
    h1 { font-size: 22px; margin: 0; letter-spacing: -.4px; }
    .mark { color: #3DFF9A; font-size: 12px; font-weight: 700; letter-spacing: 2px; margin: 24px 0 18px; }
    .k { color: #7A9A86; font-size: 12px; letter-spacing: 1px; margin: 0 0 6px; }
    .v { font-size: 16px; margin: 0 0 22px; }
    .field {
      padding: 10px; border: 1px solid #1C3326; background: #0C140F; border-radius: 12px;
      font: 13px ui-monospace, monospace; color: #E7F6EC;
    }
    .hint { color: #7A9A86; font-size: 12px; line-height: 16px; margin: 8px 0 0; }
    .grow { flex: 1; }
    .out {
      border: 1px solid #1C3326; border-radius: 16px; color: #FF6B6B;
      text-align: center; padding: 14px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="top"><div class="back">←</div><h1>Настройки</h1></div>
    <div class="mark">ANTIGRAVITY</div>
    <p class="k">АККАУНТ</p>
    <p class="v">zaigraevstepan7@gmail.com</p>
    <p class="k">РАБОЧАЯ ПАПКА</p>
    <div class="field">/storage/emulated/0/Antigravity</div>
    <p class="hint">Агент читает и пишет файлы относительно этой директории.</p>
    <div class="grow"></div>
    <div class="out">Выйти</div>
  </div>
</body>
</html>
