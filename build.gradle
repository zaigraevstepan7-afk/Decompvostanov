plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        nursultan {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def ver = project.version
    inputs.property "version", ver
    filesMatching("fabric.mod.json") {
        expand "version": ver
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    workbench {
        java.srcDir 'workbench/src/main/java'
        resources.srcDir 'src/main/resources'
    }
}

dependencies {
    workbenchImplementation 'com.google.code.gson:gson:2.11.0'
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.workbench.runtimeClasspath
    mainClass = 'fun.nursultan.restore.Main'
    args '--self-test'
    workingDir = rootDir
}

tasks.register('workbenchRun', JavaExec) {
    group = 'application'
    classpath = sourceSets.workbench.runtimeClasspath
    mainClass = 'fun.nursultan.restore.Main'
    workingDir = rootDir
}
